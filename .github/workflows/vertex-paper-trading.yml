name: Vertex Paper Trading - 3:29 PM IST

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/vertex-paper-trading.yml'
  schedule:
    # Full NSE daily candle is only available after the 15:30 market close.
    # First attempt 15:51 IST, then backups. Idempotent session processing.
    - cron: '21 10 * * 1-5'
    # 16:11 IST
    - cron: '41 10 * * 1-5'
    # 16:41 IST
    - cron: '11 11 * * 1-5'
    # 17:11 IST
    - cron: '41 11 * * 1-5'

permissions:
  contents: write

concurrency:
  group: vertex-paper-trading-main
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify trading calculations
        run: python -m unittest discover -s tests -v
      - name: Collect Chartink and simulate paper session
        id: trade
        env:
          # A manual run should work at night using prior session quotes,
          # without changing the weekday schedule or fabricating today's prices.
          MANUAL_LATEST_SESSION: ${{ github.event_name == 'workflow_dispatch' }}
          CHARTINK_SCAN_URL: https://chartink.com/screener/vertex-signal-lue-line
          CHARTINK_USER: ${{ secrets.CHARTINK_USER }}
          CHARTINK_PASSWORD: ${{ secrets.CHARTINK_PASSWORD }}
          CHARTINK_COOKIE: ${{ secrets.CHARTINK_COOKIE }}
          # Angel One is the ONLY market-price provider for paper buys, sells and daily verification.
          # Credentials are never written to report/state/logs.
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        # Push also attempts an initial run. Outside market hours it safely skips.
        run: python -m src.run
      - name: Persist paper-trading state and public dashboard data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json docs/data/report.json docs/data/latest_scan.json docs/data/latest_prices.json ACTIVE_TRADES.md TRADE_HISTORY.md SCANNER_SYMBOLS.md PRICE_CHECK.md
          if ! git diff --cached --quiet; then
            git commit -m "data: record daily paper trading session [skip ci]"
            # A commit can land on main while Chromium is scraping.
            # Fetch and rebase rather than force-pushing over those changes.
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Conflict while rebasing paper data; refusing to overwrite remote portfolio"
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Paper results saved on attempt $attempt"
                exit 0
              fi
              echo "Remote moved during push; retrying $attempt/3"
              sleep 3
            done
            echo "::error::Unable to save results after 3 safe push attempts"
            exit 1
          fi
