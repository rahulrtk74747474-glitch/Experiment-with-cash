name: Angel One Read-Only Connection Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/angel-one-connection-test.yml'

permissions:
  contents: read

jobs:
  test-connection:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install API client
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify credentials, login, and historical data (no orders)
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: python -m scripts.check_angel_connection
